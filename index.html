<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline ASCII Art Generator</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --panel-bg: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 18px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .status {
            font-size: 13px;
            color: #4ade80;
            margin-bottom: 15px;
            text-align: right;
        }

        #output {
            width: 100%;
            height: 480px;
            background-color: #020617;
            color: var(--accent-color);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            line-height: 1.0;
            letter-spacing: 0.2px;
            overflow: auto;
            white-space: pre;
            box-sizing: border-box;
        }

        .btn-copy {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-copy:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Outline ASCII Art Generator</h1>
    
    <div class="input-group">
        <input type="text" id="textInput" placeholder="영어 또는 한국어를 입력하세요..." value="안녕">
    </div>
    <div class="status" id="statusMessage">● 스무딩 벡터 알고리즘 적용 완료</div>

    <div id="output"></div>
    
    <button class="btn-copy" onclick="copyToClipboard()">아스크 아트 복사하기</button>
</div>

<canvas id="analysisCanvas" style="display:none;"></canvas>

<script>
    const textInput = document.getElementById('textInput');
    const output = document.getElementById('output');
    const canvas = document.getElementById('analysisCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function generateSmoothOutline() {
        const text = textInput.value;
        if (!text) {
            output.textContent = "";
            return;
        }

        // 선을 더 굵고 뚜렷하게 잡기 위해 고정 두께 스타일의 고딕 계열 선언
        const fontHeight = 70; 
        ctx.font = `bold ${fontHeight}px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif`;
        
        const metrics = ctx.measureText(text);
        const textWidth = Math.ceil(metrics.width) + 40;
        const textHeight = Math.ceil(fontHeight * 1.6);

        canvas.width = textWidth;
        canvas.height = textHeight;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, textWidth, textHeight);
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${fontHeight}px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 20, textHeight / 2);

        const imgData = ctx.getImageData(0, 0, textWidth, textHeight);
        const data = imgData.data;

        // 투명도/밝기 판별 헬퍼
        const getPixel = (x, y) => {
            if (x < 0 || x >= textWidth || y < 0 || y >= textHeight) return 0;
            return data[(Math.floor(y) * textWidth + Math.floor(x)) * 4]; 
        };

        let result = "";
        
        // 피글렛 폰트 비율과 선 연결성을 위한 해상도 최적화 스텝
        const stepX = 2.4; 
        const stepY = 5.0; 

        for (let y = stepY; y < textHeight - stepY; y += stepY) {
            let row = "";
            for (let x = stepX; x < textWidth - stepX; x += stepX) {
                
                const center = getPixel(x, y) > 128;

                if (center) {
                    // 주변 4방향 경계선 체크
                    const u = getPixel(x, y - stepY) > 128;
                    const d = getPixel(x, y + stepY) > 128;
                    const l = getPixel(x - stepX, y) > 128;
                    const r = getPixel(x + stepX, y) > 128;

                    // 내부 픽셀은 과감하게 비워서 빈 곽 구현
                    if (u && d && l && r) {
                        row += " ";
                        continue;
                    }

                    // 대각선 성분 분석을 통해 부드러운 연결 문자 할당
                    const ul = getPixel(x - stepX, y - stepY) > 128;
                    const ur = getPixel(x + stepX, y - stepY) > 128;
                    const dl = getPixel(x - stepX, y + stepY) > 128;
                    const dr = getPixel(x + stepX, y + stepY) > 128;

                    // 모퉁이 흐름 및 경계선 기울기 판정 로직 개선
                    if (!u && !l) row += "/";
                    else if (!u && !r) row += "\\";
                    else if (!d && !l) row += "\\";
                    else if (!d && !r) row += "/";
                    else if (l && r && !u) row += "_";
                    else if (l && r && !d) row += "_";
                    else if (u && d && !l) row += "|";
                    else if (u && d && !r) row += "|";
                    else if (!ul || !dr) row += "\\";
                    else if (!ur || !dl) row += "/";
                    else row += "|";
                } else {
                    // 바깥 영역 보정 (윗라인이 글자 내부인 경우 밑줄로 하단 경계면 마감)
                    const u = getPixel(x, y - stepY) > 128;
                    const d = getPixel(x, y + stepY) > 128;
                    if (u && !d) {
                        row += "_";
                    } else {
                        row += " ";
                    }
                }
            }
            if (row.trim().length > 0) {
                result += row + "\n";
            }
        }

        output.textContent = result;
    }

    textInput.addEventListener('input', generateSmoothOutline);
    window.addEventListener('load', generateSmoothOutline);

    function copyToClipboard() {
        const text = output.textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('자연스러운 외곽선 아스키 아트가 복사되었습니다!');
        }).catch(err => {
            alert('복사 실패: ', err);
        });
    }
</script>

</body>
</html>
