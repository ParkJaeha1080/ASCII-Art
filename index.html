<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Shaded Block ASCII Generator</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --panel-bg: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 18px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        #output {
            width: 100%;
            height: 520px;
            background-color: #020617;
            color: var(--accent-color);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            line-height: 1.0;
            letter-spacing: 0px;
            overflow: auto;
            white-space: pre;
            box-sizing: border-box;
        }

        .btn-copy {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-copy:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>3D Shaded Block ASCII Generator</h1>
    
    <div class="input-group">
        <input type="text" id="textInput" placeholder="영어 또는 한국어를 입력하세요..." value="안녕">
    </div>

    <div id="output"></div>
    
    <button class="btn-copy" onclick="copyToClipboard()">아스키 아트 복사하기</button>
</div>

<canvas id="analysisCanvas" style="display:none;"></canvas>

<script>
    const textInput = document.getElementById('textInput');
    const output = document.getElementById('output');
    const canvas = document.getElementById('analysisCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function generateShaded3D() {
        const text = textInput.value;
        if (!text) {
            output.textContent = "";
            return;
        }

        // 각진 모양을 예쁘게 뽑아내기 위해 굵은 폰트 지정
        const fontHeight = 56; 
        ctx.font = `bold ${fontHeight}px 'Arial', 'Malgun Gothic', sans-serif`;
        
        const metrics = ctx.measureText(text);
        const textWidth = Math.ceil(metrics.width) + 70;
        const textHeight = Math.ceil(fontHeight * 1.9);

        canvas.width = textWidth;
        canvas.height = textHeight;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, textWidth, textHeight);
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${fontHeight}px 'Arial', 'Malgun Gothic', sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 15, textHeight / 2 - 15);

        const imgData = ctx.getImageData(0, 0, textWidth, textHeight);
        const data = imgData.data;

        // 원본 폰트 위치 판별 (이진화 마스크)
        const isFilled = (x, y) => {
            if (x < 0 || x >= textWidth || y < 0 || y >= textHeight) return false;
            return data[(Math.floor(y) * textWidth + Math.floor(x)) * 4] > 140; 
        };

        let result = "";
        const stepX = 2.0; 
        const stepY = 4.0; 
        const depth = 6; // 우하단으로 이어질 3D 입체면 두께 강도

        for (let y = 0; y < textHeight; y += stepY) {
            let row = "";
            for (let x = 0; x < textWidth; x += stepX) {
                
                const currentFilled = isFilled(x, y);

                // 1. 글자의 정면(앞표면) 영역 처리
                if (currentFilled) {
                    const u = isFilled(x, y - stepY);
                    const d = isFilled(x, y + stepY);
                    const l = isFilled(x - stepX, y);
                    const r = isFilled(x + stepX, y);

                    // 글자 전면의 완전 안쪽 영역은 무조건 공백(' ') 처리하여 깨끗하게 비워둠
                    if (u && d && l && r) {
                        row += " ";
                        continue;
                    }

                    // 전면부 윤곽 테두리 마감선 설정
                    if (!u && !l) row += "/";
                    else if (!u && !r) row += "\\";
                    else if (!d && !l) row += "\\";
                    else if (!d && !r) row += "/";
                    else if (!u || !d) row += "_";
                    else if (!l || !r) row += "|";
                    else row += " ";
                    continue;
                }

                // 2. 글자 바깥 영역: 우하단 깊이(Depth) 역추적을 통한 입체 빗금 벽면 형성
                let is3DWall = false;
                let is3DEdge = false;
                
                for (let d = 1; d <= depth; d++) {
                    const checkX = x - (d * stepX);
                    const checkY = y - (d * stepY * 0.5); // 사선 왜곡 비율 매칭
                    
                    if (isFilled(checkX, checkY)) {
                        is3DWall = true;
                        if (d === depth) {
                            is3DEdge = true; // 맨 마지막 3D 바닥면 경계
                        }
                        break;
                    }
                }

                if (is3DWall) {
                    if (is3DEdge) {
                        // 3D 블록이 끝나는 맨 밑바닥 경계선 깔끔하게 마감
                        const uSpace = !isFilled(x, y - stepY);
                        row += uSpace ? "_" : "\\";
                    } else {
                        // 예시 텍스트와 동일하게 3D 입체 기둥 내부를 사선('\')으로 가득 채움
                        row += "\\";
                    }
                } else {
                    row += " ";
                }
            }
            if (row.trim().length > 0) {
                result += row + "\n";
            }
        }

        output.textContent = result;
    }

    textInput.addEventListener('input', generateShaded3D);
    window.addEventListener('load', generateShaded3D);

    function copyToClipboard() {
        const text = output.textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('입체 사선이 적용된 아스키 아트가 복사되었습니다!');
        }).catch(err => {
            alert('복사 실패: ', err);
        });
    }
</script>

</body>
</html>
