<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Isometric ASCII Art Generator</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --panel-bg: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 18px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        #output {
            width: 100%;
            height: 520px;
            background-color: #020617;
            color: var(--accent-color);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            line-height: 1.0;
            letter-spacing: 0.3px;
            overflow: auto;
            white-space: pre;
            box-sizing: border-box;
        }

        .btn-copy {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-copy:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>3D Isometric ASCII Generator</h1>
    
    <div class="input-group">
        <input type="text" id="textInput" placeholder="영어 또는 한국어를 입력하세요..." value="안녕">
    </div>

    <div id="output"></div>
    
    <button class="btn-copy" onclick="copyToClipboard()">아스키 아트 복사하기</button>
</div>

<canvas id="analysisCanvas" style="display:none;"></canvas>

<script>
    const textInput = document.getElementById('textInput');
    const output = document.getElementById('output');
    const canvas = document.getElementById('analysisCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function generateIsometric3D() {
        const text = textInput.value;
        if (!text) {
            output.textContent = "";
            return;
        }

        // 고정 폭의 각진 스타일을 얻기 위해 산세리프 계열 폰트 사용
        const fontHeight = 55; 
        ctx.font = `bold ${fontHeight}px 'Arial', 'Malgun Gothic', sans-serif`;
        
        const metrics = ctx.measureText(text);
        const textWidth = Math.ceil(metrics.width) + 60;
        const textHeight = Math.ceil(fontHeight * 1.8);

        canvas.width = textWidth;
        canvas.height = textHeight;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, textWidth, textHeight);
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${fontHeight}px 'Arial', 'Malgun Gothic', sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 15, textHeight / 2 - 10);

        const imgData = ctx.getImageData(0, 0, textWidth, textHeight);
        const data = imgData.data;

        // 특정 좌표에 글자 픽셀이 있는지 판단 (바이너리 마스크)
        const isFilled = (x, y) => {
            if (x < 0 || x >= textWidth || y < 0 || y >= textHeight) return false;
            return data[(Math.floor(y) * textWidth + Math.floor(x)) * 4] > 150; 
        };

        let result = "";
        const stepX = 2.2; 
        const stepY = 4.4; 
        
        // 3D 블록 두께 설정 (우하단으로 들어갈 입체 깊이)
        const depth = 4; 

        for (let y = 0; y < textHeight; y += stepY) {
            let row = "";
            for (let x = 0; x < textWidth; x += stepX) {
                
                const mainObj = isFilled(x, y);

                // 1. 글자의 전면부(가장 앞쪽 표면) 처리
                if (mainObj) {
                    const u = isFilled(x, y - stepY);
                    const d = isFilled(x, y + stepY);
                    const l = isFilled(x - stepX, y);
                    const r = isFilled(x + stepX, y);

                    // 글자 전면부 내부 영역은 하얗게 비워둠
                    if (u && d && l && r) {
                        row += " ";
                        continue;
                    }

                    // 전면부의 테두리선 마감
                    if (!u && !l) row += "/";
                    else if (!u && !r) row += "\\";
                    else if (!d && !l) row += "\\";
                    else if (!d && !r) row += "/";
                    else if (!u || !d) row += "_";
                    else if (!l || !r) row += "|";
                    else row += " ";
                    continue;
                }

                // 2. 글자 바깥 영역: 우하단 사선 방향으로 깊이(Depth)를 추적하여 3D 입체 벽면 생성
                let isShadow = false;
                let shadowEdge = false;
                
                for (let d = 1; d <= depth; d++) {
                    // 오른쪽 위 방향으로 역추적해서 원래 글자가 있다면, 현재 좌표는 입체 두께 부위임
                    const checkX = x - (d * stepX);
                    const checkY = y - (d * stepY * 0.5); // 사선 각도 보정
                    
                    if (isFilled(checkX, checkY)) {
                        isShadow = true;
                        // 입체 벽면의 맨 마지막 끝자락인지 확인
                        if (d === depth) {
                            shadowEdge = true;
                        }
                        break;
                    }
                }

                if (isShadow) {
                    if (shadowEdge) {
                        // 입체 블록의 맨 오른쪽/아래쪽 끝 외곽선 마감
                        const uSpace = !isFilled(x, y - stepY);
                        if (uSpace) row += "_";
                        else row += "\\";
                    } else {
                        // 입체 블록의 내부 음영 채우기 (보내주신 예시 이미지처럼 촘촘한 사선 기둥 표현)
                        row += "\\";
                    }
                } else {
                    row += " ";
                }
            }
            if (row.trim().length > 0) {
                result += row + "\n";
            }
        }

        output.textContent = result;
    }

    textInput.addEventListener('input', generateIsometric3D);
    window.addEventListener('load', generateIsometric3D);

    function copyToClipboard() {
        const text = output.textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('3D 블록 아스키 아트가 클립보드에 복사되었습니다!');
        }).catch(err => {
            alert('복사 실패: ', err);
        });
    }
</script>

</body>
</html>
