<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Outline ASCII Art Generator</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --panel-bg: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 18px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .status {
            font-size: 13px;
            color: #4ade80;
            margin-bottom: 15px;
            text-align: right;
        }

        #output {
            width: 100%;
            height: 480px;
            background-color: #020617;
            color: var(--accent-color);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            line-height: 1.0;
            letter-spacing: 0.5px;
            overflow: auto;
            white-space: pre;
            box-sizing: border-box;
        }

        .btn-copy {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-copy:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Outline ASCII Art Generator</h1>
    
    <div class="input-group">
        <input type="text" id="textInput" placeholder="영어 또는 한국어를 입력하세요..." value="안녕">
    </div>
    <div class="status" id="statusMessage">● 하단 안티앨리어싱 보정 모드 작동 중</div>

    <div id="output"></div>
    
    <button class="btn-copy" onclick="copyToClipboard()">아스키 아트 복사하기</button>
</div>

<canvas id="analysisCanvas" style="display:none;"></canvas>

<script>
    const textInput = document.getElementById('textInput');
    const output = document.getElementById('output');
    const canvas = document.getElementById('analysisCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function generatePerfectOutline() {
        const text = textInput.value;
        if (!text) {
            output.textContent = "";
            return;
        }

        // 고딕 굵은 체 선언
        const fontHeight = 64; 
        ctx.font = `bold ${fontHeight}px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif`;
        
        const metrics = ctx.measureText(text);
        const textWidth = Math.ceil(metrics.width) + 40;
        const textHeight = Math.ceil(fontHeight * 1.6);

        canvas.width = textWidth;
        canvas.height = textHeight;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, textWidth, textHeight);
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${fontHeight}px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 20, textHeight / 2);

        const imgData = ctx.getImageData(0, 0, textWidth, textHeight);
        const data = imgData.data;

        // 임계값을 200으로 높여 흐릿하게 번진 픽셀(뾰족해지는 원인)을 완벽 차단
        const isFilled = (x, y) => {
            if (x < 0 || x >= textWidth || y < 0 || y >= textHeight) return false;
            return data[(Math.floor(y) * textWidth + Math.floor(x)) * 4] > 200; 
        };

        let result = "";
        
        // 행간 비율 엄격 보정
        const stepX = 2.5; 
        const stepY = 5.0; 

        for (let y = stepY; y < textHeight - stepY; y += stepY) {
            let row = "";
            for (let x = stepX; x < textWidth - stepX; x += stepX) {
                
                const center = isFilled(x, y);

                if (center) {
                    const u = isFilled(x, y - stepY);
                    const d = isFilled(x, y + stepY);
                    const l = isFilled(x - stepX, y);
                    const r = isFilled(x + stepX, y);

                    // 내부 공백화
                    if (u && d && l && r) {
                        row += " ";
                        continue;
                    }

                    // 상하좌우 경계면 형태 매핑
                    if (!u && !l) row += "/";
                    else if (!u && !r) row += "\\";
                    else if (!d && !l) row += "\\";
                    else if (!d && !r) row += "/";
                    else if (!u) row += "_";
                    else if (!d) row += "_";
                    else if (!l || !r) row += "|";
                    else row += " ";
                } else {
                    // 밑바닥 평평함 보정 장치: 
                    // 현재 칸은 비어있고, 바로 윗칸(u)과 대각선 위가 채워져 있다면 밑바닥 수평선 처리
                    const u = isFilled(x, y - stepY);
                    const ul = isFilled(x - stepX, y - stepY);
                    const ur = isFilled(x + stepX, y - stepY);

                    if (u || (ul && ur)) {
                        row += "_";
                    } else {
                        row += " ";
                    }
                }
            }
            if (row.trim().length > 0) {
                result += row + "\n";
            }
        }

        // 연속적인 비정상 문자 필터링 후 출력
        output.textContent = result;
    }

    textInput.addEventListener('input', generatePerfectOutline);
    window.addEventListener('load', generatePerfectOutline);

    function copyToClipboard() {
        const text = output.textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('보정된 아스키 아트가 복사되었습니다!');
        }).catch(err => {
            alert('복사 실패: ', err);
        });
    }
</script>

</body>
</html>
