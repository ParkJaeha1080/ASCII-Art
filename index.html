<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hollow Block ASCII Generator</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --panel-bg: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 18px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        #output {
            width: 100%;
            height: 520px;
            background-color: #020617;
            color: var(--accent-color);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            line-height: 1.0;
            letter-spacing: 0px;
            overflow: auto;
            white-space: pre;
            box-sizing: border-box;
        }

        .btn-copy {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-copy:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>3D Hollow Block ASCII Generator</h1>
    
    <div class="input-group">
        <input type="text" id="textInput" placeholder="영어 또는 한국어를 입력하세요..." value="안녕">
    </div>

    <div id="output"></div>
    
    <button class="btn-copy" onclick="copyToClipboard()">아스키 아트 복사하기</button>
</div>

<canvas id="analysisCanvas" style="display:none;"></canvas>

<script>
    const textInput = document.getElementById('textInput');
    const output = document.getElementById('output');
    const canvas = document.getElementById('analysisCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function generateHollow3D() {
        const text = textInput.value;
        if (!text) {
            output.textContent = "";
            return;
        }

        // 고정 굵기의 폰트 설정
        const fontHeight = 54; 
        ctx.font = `bold ${fontHeight}px 'Arial', 'Malgun Gothic', sans-serif`;
        
        const metrics = ctx.measureText(text);
        const textWidth = Math.ceil(metrics.width) + 60;
        const textHeight = Math.ceil(fontHeight * 1.8);

        canvas.width = textWidth;
        canvas.height = textHeight;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, textWidth, textHeight);
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${fontHeight}px 'Arial', 'Malgun Gothic', sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 15, textHeight / 2 - 10);

        const imgData = ctx.getImageData(0, 0, textWidth, textHeight);
        const data = imgData.data;

        // 원본 글자 마스크 판별 함수
        const isFilled = (x, y) => {
            if (x < 0 || x >= textWidth || y < 0 || y >= textHeight) return false;
            return data[(Math.floor(y) * textWidth + Math.floor(x)) * 4] > 150; 
        };

        // 특정 좌표가 원본 글자의 '외곽 테두리선'에 해당하는지 체크
        const isEdge = (x, y) => {
            if (!isFilled(x, y)) return false;
            const u = isFilled(x, y - stepY);
            const d = isFilled(x, y + stepY);
            const l = isFilled(x - stepX, y);
            const r = isFilled(x + stepX, y);
            return !(u && d && l && r); // 상하좌우가 다 채워져 있다면 내부(False), 하나라도 비었으면 테두리(True)
        };

        let result = "";
        const stepX = 2.2; 
        const stepY = 4.4; 
        const depth = 5; // 입체 기둥의 길이 (두께)

        for (let y = 0; y < textHeight; y += stepY) {
            let row = "";
            for (let x = 0; x < textWidth; x += stepX) {
                
                const currentFilled = isFilled(x, y);

                // 1. 전면부(가장 앞 표면) 처리
                if (currentFilled) {
                    const u = isFilled(x, y - stepY);
                    const d = isFilled(x, y + stepY);
                    const l = isFilled(x - stepX, y);
                    const r = isFilled(x + stepX, y);

                    // 글자 전면의 완전 내부 영역은 속을 하얗게 비워둡니다 (핵심 요구사항)
                    if (u && d && l && r) {
                        row += " ";
                        continue;
                    }

                    // 전면부의 테두리 윤곽선 그리기
                    if (!u && !l) row += "/";
                    else if (!u && !r) row += "\\";
                    else if (!d && !l) row += "\\";
                    else if (!d && !r) row += "/";
                    else if (!u || !d) row += "_";
                    else if (!l || !r) row += "|";
                    else row += " ";
                    continue;
                }

                // 2. 글자 바깥(배경) 영역: 입체 기둥면 추적
                let drawChar = " ";
                
                for (let d = 1; d <= depth; d++) {
                    const checkX = x - (d * stepX);
                    const checkY = y - (d * stepY * 0.5); // 우하단 사선 투영 각도
                    
                    // 역추적한 위치가 원본 글자의 '테두리선'인 경우에만 3D 입체선 연결
                    if (isEdge(checkX, checkY)) {
                        if (d === depth) {
                            // 3D 블록의 가장 맨 뒷면(바닥 마감선)
                            const uSpace = !isFilled(x, y - stepY);
                            drawChar = uSpace ? "_" : "\\";
                        } else {
                            // 앞면과 뒷면을 이어주는 사선 테두리 기둥 (내부는 비우고 테두리 축만 남김)
                            // 모서리 꺾임 연결 부위를 매끄럽게 연결하기 위해 사선 배치
                            drawChar = "\\";
                        }
                        break;
                    }
                }

                row += drawChar;
            }
            if (row.trim().length > 0) {
                result += row + "\n";
            }
        }

        output.textContent = result;
    }

    textInput.addEventListener('input', generateHollow3D);
    window.addEventListener('load', generateHollow3D);

    function copyToClipboard() {
        const text = output.textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('속이 빈 3D 블록 아스키 아트가 복사되었습니다!');
        }).catch(err => {
            alert('복사 실패: ', err);
        });
    }
</script>

</body>
</html>
