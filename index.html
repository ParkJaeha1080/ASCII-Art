<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pop-out ASCII Art Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/figlet.js/1.6.0/figlet.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f1f5f9;
            --accent-color: #38bdf8;
            --panel-bg: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #020617;
            color: #fff;
            font-size: 20px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        #output {
            width: 100%;
            height: 500px;
            background-color: #020617;
            color: var(--accent-color);
            border: 2px solid #1e293b;
            border-radius: 8px;
            padding: 25px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            line-height: 1.0;
            letter-spacing: 0px;
            overflow: auto;
            white-space: pre;
            box-sizing: border-box;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.8);
        }

        .btn-copy {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background-color: var(--accent-color);
            color: #020617;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            background-color: #7dd3fc;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>3D Pop-out ASCII Generator</h1>
    
    <div class="input-group">
        <input type="text" id="textInput" placeholder="영어 또는 한국어를 입력하세요..." value="Hello">
    </div>

    <div id="output"></div>
    
    <button class="btn-copy" onclick="copyToClipboard()">아스키 아트 복사하기</button>
</div>

<canvas id="renderCanvas" style="display:none;"></canvas>

<script>
    const textInput = document.getElementById('textInput');
    const output = document.getElementById('output');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function generate3DAscii() {
        const text = textInput.value;
        if (!text) {
            output.textContent = "";
            return;
        }

        // 영문/숫자 전용: FIGlet의 오리지널 3D 입체 폰트(Slant/Standard) 엔진 구동
        if (/^[a-zA-Z0-9\s.,!@#$%^&*()_+=\-[\]{}|;':",./<>?`~]+$/.test(text)) {
            figlet.text(text, {
                font: 'Slant', // 비스듬하게 툭 튀어나오는 명품 입체 폰트
                horizontalLayout: 'fitted',
                verticalLayout: 'default'
            }, function(err, data) {
                if (!err) {
                    output.textContent = data;
                }
            });
            return;
        }

        // 한글 포함 혼합 텍스트: 고밀도 가상 두께 섀도우 엔진 작동
        const fontSize = 65;
        ctx.font = `bold ${fontSize}px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif`;
        
        const metrics = ctx.measureText(text);
        const textWidth = Math.ceil(metrics.width) + 40;
        const textHeight = Math.ceil(fontSize * 1.6);

        canvas.width = textWidth;
        canvas.height = textHeight;

        // 캔버스 초기화
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, textWidth, textHeight);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${fontSize}px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 15, textHeight / 2);

        const imgData = ctx.getImageData(0, 0, textWidth, textHeight);
        const data = imgData.data;

        const isFilled = (x, y) => {
            if (x < 0 || x >= textWidth || y < 0 || y >= textHeight) return false;
            return data[(Math.floor(y) * textWidth + Math.floor(x)) * 4] > 140;
        };

        let result = "";
        const stepX = 2.2; 
        const stepY = 4.6; 

        for (let y = stepY; y < textHeight - stepY; y += stepY) {
            let row = "";
            for (let x = stepX; x < textWidth - stepX; x += stepX) {
                
                if (isFilled(x, y)) {
                    // 입체감을 위해 '윗방향'과 '왼쪽방향' 깊이를 분석
                    const hasTop = prejudicesCheck(isFilled, x, y, stepX, stepY, 0, -1);
                    const hasLeft = prejudicesCheck(isFilled, x, y, stepX, stepY, -1, 0);
                    const hasRight = prejudicesCheck(isFilled, x, y, stepX, stepY, 1, 0);
                    const hasBottom = prejudicesCheck(isFilled, x, y, stepX, stepY, 0, 1);

                    // 완전히 파묻힌 내부는 비움
                    if (hasTop && hasLeft && hasRight && hasBottom) {
                        row += " ";
                        continue;
                    }

                    // 튀어나온 모서리 두께 마감 처리
                    if (!hasTop && !hasLeft) row += "/";
                    else if (!hasTop && !hasRight) row += "\\";
                    else if (!hasTop) row += "_";
                    else if (!hasLeft) row += "|";
                    else if (!hasRight) row += "|";
                    else row += "/";
                } else {
                    // 글자 바깥 영역 중 '그림자가 맺히는 사선 부위'를 추적하여 3D 벽면 생성
                    const shadowDepth = isFilled(x - stepX, y - stepY); // 대각선 그림자 추적
                    const directTop = isFilled(x, y - stepY);

                    if (shadowDepth && !directTop) {
                        row += "\\"; // 툭 튀어나온 글자의 오른쪽 아래 음영 벽면 형성
                    } else if (directTop) {
                        row += "_";
                    } else {
                        row += " ";
                    }
                }
            }
            if (row.trim().length > 0) {
                result += row + "\n";
            }
        }
        output.textContent = result;
    }

    function prejudicesCheck(fn, x, y, sx, sy, dx, dy) {
        // 단층 검사가 아닌 2단계 깊이 검사로 선 두께 보정
        return fn(x + sx * dx, y + sy * dy) && fn(x + sx * dx * 2, y + sy * dy * 2);
    }

    textInput.addEventListener('input', generate3DAscii);
    window.addEventListener('load', generate3DAscii);

    function copyToClipboard() {
        const text = output.textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('3D 입체 아스키 아트가 클립보드에 복사되었습니다!');
        }).catch(err => {
            alert('복사 실패: ', err);
        });
    }
</script>

</body>
</html>
