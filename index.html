<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline ASCII Art Generator</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --panel-bg: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 18px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .status {
            font-size: 13px;
            color: #4ade80;
            margin-bottom: 15px;
            text-align: right;
        }

        #output {
            width: 100%;
            height: 480px;
            background-color: #020617;
            color: var(--accent-color);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            line-height: 1.0;
            letter-spacing: -0.5px;
            overflow: auto;
            white-space: pre;
            box-sizing: border-box;
        }

        .btn-copy {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-copy:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Outline ASCII Art Generator</h1>
    
    <div class="input-group">
        <input type="text" id="textInput" placeholder="영어 또는 한국어를 입력하세요..." value="안녕">
    </div>
    <div class="status" id="statusMessage">● 대기 시간 없음 (로컬 벡터 모드 작동 중)</div>

    <div id="output"></div>
    
    <button class="btn-copy" onclick="copyToClipboard()">아스키 아트 복사하기</button>
</div>

<canvas id="analysisCanvas" style="display:none;"></canvas>

<script>
    const textInput = document.getElementById('textInput');
    const output = document.getElementById('output');
    const canvas = document.getElementById('analysisCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function generateOutline() {
        const text = textInput.value;
        if (!text) {
            output.textContent = "";
            return;
        }

        // 1. 가상 고해상도 캔버스에 폰트 그리기 (CORS가 전혀 없는 순수 브라우저 내장 폰트 사용)
        const fontHeight = 60; 
        ctx.font = `bold ${fontHeight}px 'Arial', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif`;
        
        const metrics = ctx.measureText(text);
        const textWidth = Math.ceil(metrics.width) + 30;
        const textHeight = Math.ceil(fontHeight * 1.5);

        canvas.width = textWidth;
        canvas.height = textHeight;

        // 배경은 검은색, 글자는 흰색으로 그려서 마스크 데이터 생성
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, textWidth, textHeight);
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${fontHeight}px 'Arial', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 15, textHeight / 2);

        // 2. 픽셀 버퍼 읽기
        const imgData = ctx.getImageData(0, 0, textWidth, textHeight);
        const data = imgData.data;

        // 특정 좌표가 글자 내부(흰색)인지 판별하는 헬퍼 함수
        const isFilled = (x, y) => {
            if (x < 0 || x >= textWidth || y < 0 || y >= textHeight) return false;
            return data[(y * textWidth + x) * 4] > 128; // R 채널 값 기준
        };

        let result = "";
        
        // 3. 자음/모음 외곽 테두리를 추적하며 \, /, |, _ 조합 배치
        // 비율 보정을 위해 스텝을 세로(y)와 가로(x)를 다르게 설정
        const stepX = 3; 
        const stepY = 6; 

        for (let y = 0; y < textHeight; y += stepY) {
            let row = "";
            for (let x = 0; x < textWidth; x += stepX) {
                
                if (isFilled(x, y)) {
                    // 현재 픽셀이 글자 안쪽일 때 주변 상하좌우를 검사하여 '경계선' 영역만 문자로 남김
                    const up = isFilled(x, y - stepY);
                    const down = isFilled(x, y + stepY);
                    const left = isFilled(x - stepX, y);
                    const right = isFilled(x + stepX, y);

                    // 글자 완전 내부 영역이면 공백 처리하여 안을 비워둠 (Figlet 스타일의 핵심)
                    if (up && down && left && right) {
                        row += " ";
                        continue;
                    }

                    // 외곽 경계선의 기울기와 위치에 따라 매핑
                    if (!up && !left) row += "/";
                    else if (!up && !right) row += "\\";
                    else if (!down && !left) row += "\\";
                    else if (!down && !right) row += "/";
                    else if (!up) row += "_";
                    else if (!down) row += "_";
                    else if (!left || !right) row += "|";
                    else row += "#";
                } else {
                    // 글자 바깥 영역이지만 윗라인이 뚫려있고 아래가 채워져 있으면 천장 문자 보정
                    const down = isFilled(x, y + stepY);
                    const downLeft = isFilled(x - stepX, y + stepY);
                    const downRight = isFilled(x + stepX, y + stepY);
                    
                    if (down && !isFilled(x, y - stepY)) {
                         row += "_";
                    } else {
                         row += " ";
                    }
                }
            }
            if (row.trim().length > 0) {
                result += row + "\n";
            }
        }

        output.textContent = result;
    }

    // 실시간 이벤트 바인딩
    textInput.addEventListener('input', generateOutline);
    window.addEventListener('load', generateOutline);

    // 복사 기능
    function copyToClipboard() {
        const text = output.textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('외곽선 아스키 아트가 클립보드에 복사되었습니다!');
        }).catch(err => {
            alert('복사 실패: ', err);
        });
    }
</script>

</body>
</html>
